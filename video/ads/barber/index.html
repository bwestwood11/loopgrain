<!DOCTYPE html>
<!-- Meta ad, concept 1 ("what you filmed vs. what you get"), barbershop.
     0-3s raw phone clip with a native-style caption, hard cut with a flash into
     the finished hero edit (3-16s), then a Loopgrain end card with the offer. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Anybody"; src: url("assets/fonts/anybody.woff2") format("woff2"); font-weight: 100 900; font-stretch: 50% 150%; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden; background: #000;
        font-family: "Inter", sans-serif;
        --ink: #15213b; --paper: #f7f8f4; --caption: #ffd23f; --cobalt: #2b54f5;
      }
      .cam { position: absolute; inset: 0; overflow: hidden; }
      .cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* Native Reels-style caption pills, upper third, clear of faces and the edit's top bar. */
      .cap {
        position: absolute; left: 50%; top: 330px;
        padding: 22px 44px; border-radius: 28px; white-space: nowrap;
        font-weight: 800; font-size: 72px; letter-spacing: -0.01em; line-height: 1;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      #capRaw { background: #fff; color: #111; }
      #capEdit { background: var(--ink); color: var(--caption); }

      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }

      /* End card */
      #end {
        position: absolute; inset: 0; background: var(--ink); color: var(--paper);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; opacity: 0;
      }
      .display { font-family: "Anybody", sans-serif; font-variation-settings: "wdth" 62; font-weight: 800; letter-spacing: -0.01em; }
      #logo { display: flex; align-items: center; gap: 22px; }
      #logo .word { font-size: 92px; line-height: 1; }
      #price { margin-top: 110px; font-size: 330px; line-height: 0.85; color: var(--caption); }
      #per { margin-top: 18px; font-size: 64px; font-weight: 700; }
      #points { margin-top: 70px; display: flex; flex-direction: column; gap: 22px; font-size: 48px; font-weight: 600; color: rgba(247, 248, 244, 0.82); }
      #url {
        margin-top: 100px; padding: 30px 64px; border-radius: 999px; background: var(--caption); color: var(--ink);
        font-size: 60px; font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.5" data-width="1080" data-height="1920">
      <div class="cam" id="camRaw">
        <video id="vidRaw" class="clip" data-layout-allow-overflow src="assets/raw.mp4" data-start="0" data-duration="3" data-track-index="0" muted playsinline></video>
      </div>
      <div class="cam" id="camEdit" data-layout-allow-overflow>
        <video id="vidEdit" class="clip" src="assets/edited.mp4" data-start="3" data-duration="13" data-track-index="0" muted playsinline></video>
      </div>

      <div class="cap" id="capRaw">What you filmed 😬</div>
      <div class="cap" id="capEdit">What we made 🔥</div>
      <div id="flash"></div>

      <div id="end">
        <div id="logo">
          <svg width="92" height="92" viewBox="0 0 26 26" aria-hidden="true">
            <rect x="6" y="1" width="14" height="24" rx="3.5" fill="#f7f8f4" />
            <path d="M11 9.5v7l5.5-3.5z" fill="#ffd23f" />
          </svg>
          <span class="word display">loopgrain</span>
        </div>
        <div id="price" class="display">$39</div>
        <div id="per">per video</div>
        <div id="points">
          <span>No subscription</span>
          <span>Back in 2 business days</span>
        </div>
        <div id="url">loopgrain.io</div>
      </div>

      <!-- SFX: start = moment - file lead, volume = 0.7 x file gain (video/jobs/edit.mjs table). -->
      <audio id="fxPop" src="assets/sfx/swoosh.mp3" data-start="0.06" data-duration="0.3" data-volume="0.25" data-track-index="3"></audio>
      <audio id="fxCut" src="assets/sfx/swoosh-2.mp3" data-start="2.53" data-duration="0.85" data-volume="0.28" data-track-index="4"></audio>
      <audio id="fxMade" src="assets/sfx/ding.mp3" data-start="3.09" data-duration="1.1" data-volume="0.42" data-track-index="5"></audio>
      <audio id="fxEnd" src="assets/sfx/swoosh-3.mp3" data-start="15.71" data-duration="0.65" data-volume="0.35" data-track-index="3"></audio>
      <audio id="fxCash" src="assets/sfx/cash-register.mp3" data-start="15.9" data-duration="1.45" data-volume="0.7" data-track-index="4"></audio>
    </div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        // Centered with xPercent so GSAP's scale doesn't fight a CSS transform.
        gsap.set(["#capRaw", "#capEdit"], { xPercent: -50, opacity: 0, scale: 0.6 });
        gsap.set("#camEdit", { opacity: 0 });
        gsap.set(["#logo", "#price", "#per", "#points span", "#url"], { opacity: 0, y: 60 });

        // 0-3s: raw clip, slow push so it isn't static; caption pops in.
        tl.fromTo("#vidRaw", { scale: 1 }, { scale: 1.06, duration: 3, ease: "none" }, 0);
        tl.to("#capRaw", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 0.15);

        // 3s: flash cut into the edit.
        tl.to("#flash", { opacity: 1, duration: 0.08, ease: "power2.in" }, 2.92);
        tl.set("#capRaw", { opacity: 0 }, 3);
        tl.set("#camEdit", { opacity: 1 }, 3);
        tl.to("#flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, 3);
        tl.fromTo("#camEdit", { scale: 1.08 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 3);

        // "What we made" holds for 2s, then gets out of the edit's way.
        tl.to("#capEdit", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 3.15);
        tl.to("#capEdit", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 5.2);

        // 16s: end card.
        tl.to("#end", { opacity: 1, duration: 0.25, ease: "power2.out" }, 16);
        tl.to("#logo", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 16.05);
        tl.to("#price", { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 16.35);
        tl.to("#per", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 16.5);
        tl.to("#points span", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.12 }, 16.7);
        tl.to("#url", { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }, 17.0);
        tl.to("#url", { scale: 1.05, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1 }, 17.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
